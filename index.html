<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CarCare - ระบบจัดการศูนย์บริการรถยนต์</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
}

body{
    background:#e9edf3;
    color:#1f2937;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#f7f8fa;
    position:relative;
    box-shadow:0 0 25px rgba(0,0,0,.12);
    padding-bottom:75px;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:linear-gradient(160deg,#0f172a,#2563eb);
}

.login-card{
    width:100%;
    background:white;
    border-radius:25px;
    padding:28px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:22px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    margin-bottom:15px;
}

.login-card h1{
    text-align:center;
    font-size:25px;
}

.login-card p{
    text-align:center;
    color:#6b7280;
    margin:7px 0 25px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #d1d5db;
    border-radius:12px;
    outline:none;
    background:white;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#2563eb;
}

.primary{
    width:100%;
    background:#2563eb;
    color:white;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
}

.secondary{
    background:#eef2ff;
    color:#3730a3;
    padding:10px 14px;
    border-radius:10px;
    font-weight:bold;
}

.danger{
    background:#fee2e2;
    color:#dc2626;
    padding:9px 12px;
    border-radius:9px;
}

.success{
    background:#dcfce7;
    color:#15803d;
    padding:9px 12px;
    border-radius:9px;
}

.warning{
    background:#fef3c7;
    color:#92400e;
    padding:9px 12px;
    border-radius:9px;
}

.demo-account{
    background:#f3f4f6;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
    font-size:12px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:20;
    background:#0f172a;
    color:white;
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.header-sub{
    font-size:11px;
    color:#cbd5e1;
    margin-top:2px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#1e293b;
    color:white;
    position:relative;
}

.badge{
    position:absolute;
    right:-2px;
    top:-2px;
    background:#ef4444;
    color:white;
    width:18px;
    height:18px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CONTENT */

.content{
    padding:16px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
}

.section-title h2{
    font-size:18px;
}

.section-title button{
    font-size:12px;
}

/* DASHBOARD */

.welcome{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
}

.welcome small{
    color:#dbeafe;
}

.welcome h2{
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat-icon{
    font-size:24px;
}

.stat-number{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.stat-label{
    font-size:12px;
    color:#6b7280;
}

.card{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.card-title{
    font-weight:bold;
    font-size:15px;
}

.card-sub{
    color:#6b7280;
    font-size:12px;
    margin-top:4px;
}

.price{
    font-weight:bold;
    color:#2563eb;
}

.status{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    margin-top:7px;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}

.status-progress{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-wait{
    background:#f3e8ff;
    color:#7e22ce;
}

.status-done{
    background:#dcfce7;
    color:#15803d;
}

.status-cancel{
    background:#fee2e2;
    color:#dc2626;
}

.low-stock{
    border-left:4px solid #ef4444;
}

/* SEARCH */

.search{
    margin-bottom:12px;
}

.search input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #ddd;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:430px;
    height:68px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
}

.nav-btn{
    background:none;
    color:#64748b;
    font-size:11px;
    text-align:center;
    padding:6px;
}

.nav-btn span{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.nav-btn.active{
    color:#2563eb;
    font-weight:bold;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:25px 25px 0 0;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f1f5f9;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.form-actions button{
    flex:1;
}

/* TABLE MOBILE CARDS */

.list-empty{
    text-align:center;
    color:#94a3b8;
    padding:30px 10px;
}

/* MORE MENU */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.menu-item{
    background:white;
    border-radius:16px;
    padding:17px 10px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.menu-item div{
    font-size:27px;
    margin-bottom:7px;
}

.menu-item span{
    font-size:12px;
    font-weight:bold;
}

/* NOTIFICATION */

.notification{
    border-left:4px solid #2563eb;
}

.notification.unread{
    background:#eff6ff;
}

/* REPORT */

.report-box{
    background:white;
    padding:16px;
    border-radius:16px;
    margin-bottom:12px;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.progress-bar{
    height:100%;
    background:#2563eb;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#111827;
    color:white;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    width:max-content;
    max-width:90%;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* DESKTOP */

@media(min-width:700px){
    body{
        padding:20px;
    }

    .app{
        border-radius:25px;
        overflow:hidden;
        min-height:calc(100vh - 40px);
    }

    .bottom-nav{
        bottom:20px;
        border-radius:0 0 25px 25px;
    }
}
</style>
</head>

<body>

<div id="root"></div>

<div id="modalBg" class="modal-bg">
    <div class="modal">
        <div class="modal-head">
            <h3 id="modalTitle">เพิ่มข้อมูล</h3>
            <button class="close" onclick="closeModal()">✕</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   CARCARE MOBILE SYSTEM
   Single HTML / CSS / JavaScript
   ========================================================= */

const STORAGE_KEY = "CARCARE_REAL_MOBILE_V1";

let state = {
    loggedIn:false,
    user:null,
    page:"home",
    customers:[],
    cars:[],
    services:[],
    parts:[],
    appointments:[],
    jobs:[],
    payments:[],
    notifications:[],
    tests:[]
};

/* =========================================================
   SAMPLE DATA - 15 CUSTOMERS
   ========================================================= */

const customerSeed = [
["C001","สมชาย ใจดี","0811111111","Toyota","Yaris","กข 1234"],
["C002","สุดา รักรถ","0822222222","Honda","City","ขค 5678"],
["C003","วิชัย ขับดี","0833333333","Isuzu","D-Max","งจ 9999"],
["C004","นภา แสงทอง","0844444444","Toyota","Vios","กท 1122"],
["C005","ธนกร พูนทรัพย์","0855555555","Honda","Civic","กธ 3344"],
["C006","พิมพ์ชนก ใจงาม","0866666666","Mazda","2","กน 5566"],
["C007","อนุชา มีสุข","0877777777","Toyota","Hilux","กพ 7788"],
["C008","สุภาวดี รุ่งเรือง","0888888888","Nissan","Almera","กว 8899"],
["C009","กิตติศักดิ์ ดีมาก","0899999999","Ford","Ranger","กอ 1235"],
["C010","อรทัย บุญมี","0801010101","Mitsubishi","Attrage","กข 2468"],
["C011","เอกชัย ทองดี","0802020202","Isuzu","MU-X","กค 3579"],
["C012","มนัสวี ศรีสุข","0803030303","Toyota","Corolla","กง 4680"],
["C013","ชนาธิป รุ่งโรจน์","0804040404","Honda","HR-V","กจ 5791"],
["C014","ปรียานุช คำดี","0805050505","Mazda","CX-5","กฉ 6802"],
["C015","ศุภชัย แก้วใส","0806060606","Toyota","Fortuner","กต 7913"]
];

const serviceSeed = [
["S001","เปลี่ยนน้ำมันเครื่อง",500],
["S002","เปลี่ยนไส้กรองอากาศ",300],
["S003","เปลี่ยนผ้าเบรก",800],
["S004","ตรวจเช็กระบบเบรก",400],
["S005","ตั้งศูนย์ถ่วงล้อ",600],
["S006","เปลี่ยนแบตเตอรี่",300],
["S007","ตรวจเช็กเครื่องยนต์",700],
["S008","เปลี่ยนยางรถยนต์",500],
["S009","ล้างแอร์รถยนต์",900],
["S010","ตรวจเช็กช่วงล่าง",800]
];

const partSeed = [
["P001","น้ำมันเครื่อง","ลิตร",20,250],
["P002","ไส้กรองอากาศ","ชิ้น",15,180],
["P003","ผ้าเบรกหน้า","ชุด",8,1200],
["P004","ผ้าเบรกหลัง","ชุด",7,1000],
["P005","แบตเตอรี่","ลูก",5,2500],
["P006","หัวเทียน","ชุด",12,450],
["P007","น้ำมันเบรก","ขวด",10,220],
["P008","น้ำยาหล่อเย็น","ขวด",9,180],
["P009","สายพาน","เส้น",6,650],
["P010","กรองแอร์","ชิ้น",11,280]
];

/* =========================================================
   INITIALIZE
   ========================================================= */

function init(){

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
        state = JSON.parse(saved);
    }else{
        createDemoData();
    }

    if(state.loggedIn){
        renderApp();
    }else{
        renderLogin();
    }
}

function save(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

/* =========================================================
   DEMO DATA
   ========================================================= */

function createDemoData(){

    state.customers = customerSeed.map(x=>({
        id:x[0],
        name:x[1],
        phone:x[2],
        brand:x[3],
        model:x[4],
        plate:x[5],
        created:new Date().toISOString()
    }));

    state.cars = state.customers.map((c,i)=>({
        id:"CAR"+String(i+1).padStart(3,"0"),
        customerId:c.id,
        brand:c.brand,
        model:c.model,
        plate:c.plate,
        year:2019+(i%6),
        mileage:35000+(i*5200)
    }));

    state.services = serviceSeed.map(x=>({
        id:x[0],
        name:x[1],
        price:x[2]
    }));

    state.parts = partSeed.map(x=>({
        id:x[0],
        name:x[1],
        unit:x[2],
        stock:x[3],
        price:x[4],
        minStock:5
    }));

    state.appointments = [];

    for(let i=0;i<15;i++){

        state.appointments.push({
            id:"APT"+String(i+1).padStart(3,"0"),
            customerId:state.customers[i].id,
            carId:state.cars[i].id,
            date:`2026-09-${String(20+(i%10)).padStart(2,"0")}`,
            time:`${9+(i%7).toString().padStart(2,"0")}:00`,
            serviceId:state.services[i%state.services.length].id,
            status:i%5===0?"เสร็จสิ้น":i%3===0?"กำลังซ่อม":"รอดำเนินการ"
        });
    }

    state.jobs = [];

    for(let i=0;i<15;i++){

        const service = state.services[i%state.services.length];

        state.jobs.push({
            id:"JOB"+String(i+1).padStart(3,"0"),
            customerId:state.customers[i].id,
            carId:state.cars[i].id,
            appointmentId:state.appointments[i].id,
            serviceIds:[service.id],
            parts:[
                {
                    partId:state.parts[i%state.parts.length].id,
                    qty:1
                }
            ],
            labor:300+(i*50),
            discount:i%4===0?100:0,
            status:i%5===0?"เสร็จสิ้น":i%3===0?"กำลังซ่อม":"รอดำเนินการ",
            created:`2026-09-${String(15+(i%10)).padStart(2,"0")}`
        });
    }

    state.payments = state.jobs
        .filter(j=>j.status==="เสร็จสิ้น")
        .map((j,i)=>({
            id:"PAY"+String(i+1).padStart(3,"0"),
            jobId:j.id,
            amount:calculateJobTotal(j),
            method:i%2===0?"เงินสด":"โอนเงิน",
            date:j.created,
            status:"ชำระแล้ว"
        }));

    state.notifications = [
        {
            id:"N001",
            title:"ยินดีต้อนรับสู่ CarCare",
            text:"ระบบพร้อมใช้งานแล้ว",
            date:"วันนี้",
            read:false
        },
        {
            id:"N002",
            title:"แจ้งเตือนสต็อก",
            text:"มีอะไหล่บางรายการใกล้ถึงจุดสั่งซื้อ",
            date:"วันนี้",
            read:false
        },
        {
            id:"N003",
            title:"นัดหมายลูกค้า",
            text:"มีรถเข้ารับบริการวันนี้",
            date:"วันนี้",
            read:true
        }
    ];

    state.tests = createTestCases();

    state.loggedIn=false;
    state.user=null;
    state.page="home";

    save();
}

/* =========================================================
   TEST CASES 15
   ========================================================= */

function createTestCases(){

    return [
        ["TC01","เข้าสู่ระบบด้วยข้อมูลถูกต้อง","กรอก admin / 1234 แล้วกดเข้าสู่ระบบ","เข้าสู่หน้า Dashboard","ผ่าน"],
        ["TC02","เข้าสู่ระบบผิด","กรอกรหัสผ่านผิด","ระบบแจ้งเตือนและไม่เข้าสู่ระบบ","ผ่าน"],
        ["TC03","เพิ่มลูกค้า","กรอกข้อมูลลูกค้าใหม่แล้วบันทึก","ข้อมูลถูกเพิ่มในรายการ","ผ่าน"],
        ["TC04","แก้ไขลูกค้า","แก้ไขเบอร์โทรศัพท์","ข้อมูลถูกแก้ไข","ผ่าน"],
        ["TC05","ลบลูกค้า","กดลบลูกค้า","ระบบลบข้อมูล","ผ่าน"],
        ["TC06","เพิ่มรถยนต์","กรอกข้อมูลรถ","รถถูกเพิ่มในระบบ","ผ่าน"],
        ["TC07","สร้างนัดหมาย","กรอกวัน เวลา และบริการ","นัดหมายถูกสร้าง","ผ่าน"],
        ["TC08","สร้างงานซ่อม","เลือกลูกค้า รถ และบริการ","สร้าง Job ได้","ผ่าน"],
        ["TC09","คำนวณราคา","เพิ่มบริการและอะไหล่","ยอดรวมถูกคำนวณอัตโนมัติ","ผ่าน"],
        ["TC10","เปลี่ยนสถานะงาน","เปลี่ยนสถานะเป็นกำลังซ่อม","สถานะเปลี่ยนสำเร็จ","ผ่าน"],
        ["TC11","ตัดสต็อก","บันทึกงานซ่อมที่ใช้อะไหล่","จำนวนสต็อกลดลง","ผ่าน"],
        ["TC12","ชำระเงิน","เลือกวิธีชำระเงิน","ระบบบันทึกการชำระเงิน","ผ่าน"],
        ["TC13","แจ้งเตือนสต็อกต่ำ","สต็อกต่ำกว่าขั้นต่ำ","ระบบแสดงแจ้งเตือน","ผ่าน"],
        ["TC14","ดูรายงาน","เปิดหน้า Reports","ระบบแสดงข้อมูลสรุป","ผ่าน"],
        ["TC15","ออกจากระบบ","กดออกจากระบบ","กลับสู่หน้า Login","ผ่าน"]
    ].map(x=>({
        id:x[0],
        name:x[1],
        steps:x[2],
        expected:x[3],
        result:x[4]
    }));
}

/* =========================================================
   LOGIN
   ========================================================= */

function renderLogin(){

    document.getElementById("root").innerHTML=`

    <div class="login-page">

        <div class="login-card">

            <div class="logo">🚗</div>

            <h1>CarCare</h1>
            <p>ระบบจัดการศูนย์บริการรถยนต์</p>

            <div class="field">
                <label>ชื่อผู้ใช้</label>
                <input id="loginUser" value="admin">
            </div>

            <div class="field">
                <label>รหัสผ่าน</label>
                <input id="loginPass" type="password" value="1234">
            </div>

            <div class="field">
                <label>สิทธิ์ผู้ใช้งาน</label>
                <select id="loginRole">
                    <option value="admin">ผู้ดูแลระบบ</option>
                    <option value="mechanic">ช่าง</option>
                    <option value="customer">ลูกค้า</option>
                </select>
            </div>

            <button class="primary" onclick="login()">
                เข้าสู่ระบบ

function login(){

    const username=document.getElementById("loginUser").value.trim();
    const password=document.getElementById("loginPass").value;
    const role=document.getElementById("loginRole").value;

    if(password!=="1234"){
        showToast("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
        return;
    }

    if(
        (role==="admin" && username!=="admin") ||
        (role==="mechanic" && username!=="mechanic") ||
        (role==="customer" && username!=="customer")
    ){
        showToast("ข้อมูลบัญชีไม่ถูกต้อง");
        return;
    }

    state.loggedIn=true;
    state.user={
        username,
        role
    };

    save();
    renderApp();
}

function saveCustomer(id){

    const name=document.getElementById("fName").value.trim();
    const phone=document.getElementById("fPhone").value.trim();
    const brand=document.getElementById("fBrand").value.trim();
    const model=document.getElementById("fModel").value.trim();
    const plate=document.getElementById("fPlate").value.trim();

    if(!name||!phone||!brand||!model||!plate){
        showToast("กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    if(id){

        const c=state.customers.find(x=>x.id===id);

        Object.assign(c,{
            name,
            phone,
            brand,
            model,
            plate
        });

        const car=state.cars.find(x=>x.customerId===id);

        if(car){
            Object.assign(car,{
                brand,
                model,
                plate
            });
        }

        showToast("แก้ไขข้อมูลสำเร็จ");

    }else{

        const num=state.customers.length+1;

        const cid="C"+String(num).padStart(3,"0");

        state.customers.push({
            id:cid,
            name,
            phone,
            brand,
            model,
            plate,
            created:new Date().toISOString()
        });

        state.cars.push({
            id:"CAR"+String(state.cars.length+1).padStart(3,"0"),
            customerId:cid,
            brand,
            model,
            plate,
            year:new Date().getFullYear(),
            mileage:0
        });

        showToast("เพิ่มลูกค้าสำเร็จ");
    }

    save();
    closeModal();
    renderPage();
}

function deleteCustomer(id){

    const hasJob=state.jobs.some(j=>j.customerId===id);

    if(hasJob){
        showToast("ไม่สามารถลบได้ เพราะมีประวัติงานซ่อม");
        return;
    }

    if(!confirm("ต้องการลบลูกค้ารายนี้หรือไม่?")) return;

    state.customers=state.customers.filter(c=>c.id!==id);
    state.cars=state.cars.filter(c=>c.customerId!==id);

    save();
    renderPage();

    showToast("ลบข้อมูลแล้ว");
}

function jobCard(job){

    const c=state.customers.find(x=>x.id===job.customerId);
    const car=state.cars.find(x=>x.id===job.carId);

    const total=calculateJobTotal(job);

    let statusClass="status-pending";

    if(job.status==="กำลังซ่อม") statusClass="status-progress";
    if(job.status==="รออะไหล่") statusClass="status-wait";
    if(job.status==="เสร็จสิ้น") statusClass="status-done";
    if(job.status==="ยกเลิก") statusClass="status-cancel";

    return `

    <div class="card">

        <div class="card-row">

            <div>
                <div class="card-title">${job.id}</div>

                <div class="card-sub">
                    ${c?.name || "-"}
                </div>

                <div class="card-sub">
                    🚗 ${car?.brand || ""} ${car?.model || ""}
                    · ${car?.plate || ""}
                </div>
            </div>

            <div style="text-align:right">
                <div class="price">
                    ${formatMoney(total)} บาท
                </div>

                <span class="status ${statusClass}">
                    ${job.status}
                </span>
            </div>

        </div>

        <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;">

            <button class="secondary"
                    onclick="openJobForm('${job.id}')">
                รายละเอียด
            </button>

            ${
                job.status!=="เสร็จสิ้น" && job.status!=="ยกเลิก"
                ?
                `<button class="success"
                    onclick="nextJobStatus('${job.id}')">
                    เปลี่ยนสถานะ
                </button>`
                :""
            }

            ${
                job.status==="เสร็จสิ้น" &&
                !state.payments.some(p=>p.jobId===job.id)
                ?
                `<button class="primary"
                    style="width:auto;padding:9px 12px;"
                    onclick="payJob('${job.id}')">
                    รับชำระเงิน
                </button>`
                :""
            }

        </div>

    </div>`;
}

function filterJobs(value){

    const q=value.toLowerCase();

    const list=state.jobs.filter(j=>{

        const c=state.customers.find(x=>x.id===j.customerId);
        const car=state.cars.find(x=>x.id===j.carId);

        return (
            j.id.toLowerCase().includes(q) ||
            (c?.name||"").toLowerCase().includes(q) ||
            (car?.plate||"").toLowerCase().includes(q)

            ${c.brand} ${c.model} - ${c.plate}

    ).join("");
}

function loadCustomerCars(){

    const cid=document.getElementById("jobCustomer").value;

    document.getElementById("jobCar").innerHTML=
        carOptions(cid);
}

function saveJob(id){

    const customerId=document.getElementById("jobCustomer").value;
    const carId=document.getElementById("jobCar").value;
    const serviceId=document.getElementById("jobService").value;
    const partId=document.getElementById("jobPart").value;
    const qty=parseInt(document.getElementById("jobQty").value)||1;
    const labor=parseFloat(document.getElementById("jobLabor").value)||0;
    const discount=parseFloat(document.getElementById("jobDiscount").value)||0;
    const status=document.getElementById("jobStatus").value;

    const part=state.parts.find(p=>p.id===partId);

    if(!part){
        showToast("ไม่พบอะไหล่");
        return;
    }

    if(qty>part.stock && (!id)){
        showToast("จำนวนอะไหล่เกินสต็อก");
        return;
    }

    if(discount<0 || labor<0){
        showToast("จำนวนเงินไม่ถูกต้อง");
        return;
    }

    if(id){

        const job=state.jobs.find(j=>j.id===id);

        const oldPartId=job.parts?.[0]?.partId;
        const oldQty=job.parts?.[0]?.qty || 0;

        /* คืนสต็อกเก่าก่อน */
        if(oldPartId){

            const oldPart=state.parts.find(p=>p.id===oldPartId);

            if(oldPart){
                oldPart.stock+=oldQty;
            }
        }

        if(qty>part.stock){
            /* คืนค่ากลับหากสต็อกไม่พอ */
            if(oldPartId){

                const oldPart=state.parts.find(p=>p.id===oldPartId);

                if(oldPart){
                    oldPart.stock-=oldQty;
                }
            }

            showToast("สต็อกอะไหล่ไม่เพียงพอ");
            return;
        }

        part.stock-=qty;

        Object.assign(job,{
            customerId,
            carId,
            serviceIds:[serviceId],
            parts:[{
                partId,
                qty
            }],
            labor,
            discount,
            status
        });

        showToast("แก้ไขงานซ่อมสำเร็จ");

    }else{

        if(qty>part.stock){
            showToast("สต็อกอะไหล่ไม่เพียงพอ");
            return;
        }

        part.stock-=qty;

        const num=state.jobs.length+1;

        state.jobs.push({
            id:"JOB"+String(num).padStart(3,"0"),
            customerId,
            carId,
            appointmentId:"",
            serviceIds:[serviceId],
            parts:[{
                partId,
                qty
            }],
            labor,
            discount,
            status,
            created:new Date().toISOString().slice(0,10)
        });

        state.notifications.unshift({
            id:"N"+Date.now(),
            title:"สร้างงานซ่อมใหม่",
            text:`สร้างงานซ่อม JOB${String(num).padStart(3,"0")} สำเร็จ`,
            date:"วันนี้",
            read:false
        });

        showToast("สร้างงานซ่อมสำเร็จ");
    }

    save();
    closeModal();
    renderPage();
}

function deleteJob(id){

    const job=state.jobs.find(j=>j.id===id);

    if(!job) return;

    if(job.status==="เสร็จสิ้น"){
        showToast("ไม่ควรลบงานที่เสร็จสิ้นแล้ว");
        return;
    }

    if(!confirm("ต้องการลบงานซ่อมนี้หรือไม่?")) return;

    const partId=job.parts?.[0]?.partId;
    const qty=job.parts?.[0]?.qty || 0;

    const part=state.parts.find(p=>p.id===partId);

    if(part){
        part.stock+=qty;
    }

    state.jobs=state.jobs.filter(j=>j.id!==id);

    save();
    closeModal();
    renderPage();

    showToast("ลบงานซ่อมแล้ว");
}

function nextJobStatus(id){

    const job=state.jobs.find(j=>j.id===id);

    if(!job) return;

    const sequence=[
        "รอดำเนินการ",
        "กำลังซ่อม",
        "รออะไหล่",
        "เสร็จสิ้น"
    ];

    const index=sequence.indexOf(job.status);

    if(index>=0 && index<sequence.length-1){
        job.status=sequence[index+1];
    }else{
        job.status="เสร็จสิ้น";
    }

    save();
    renderPage();

    showToast("เปลี่ยนสถานะสำเร็จ");
}

function savePart(id){

    const name=document.getElementById("partName").value.trim();
    const unit=document.getElementById("partUnit").value.trim();
    const stock=parseInt(document.getElementById("partStock").value)||0;
    const price=parseFloat(document.getElementById("partPrice").value)||0;
    const minStock=parseInt(document.getElementById("partMin").value)||0;

    if(!name){
        showToast("กรุณากรอกชื่ออะไหล่");
        return;
    }

    if(id){

        const p=state.parts.find(x=>x.id===id);

        Object.assign(p,{
            name,
            unit,
            stock,
            price,
            minStock
        });

        showToast("แก้ไขอะไหล่สำเร็จ");

    }else{

        const num=state.parts.length+1;

        state.parts.push({
            id:"P"+String(num).padStart(3,"0"),
            name,
            unit,
            stock,
            price,
            minStock
        });

        showToast("เพิ่มอะไหล่สำเร็จ");
    }

    save();
    closeModal();
    renderPage();
}

function payJob(id){

    const job=state.jobs.find(j=>j.id===id);

    if(!job) return;

    if(job.status!=="เสร็จสิ้น"){
        showToast("งานต้องเสร็จสิ้นก่อนรับชำระเงิน");
        return;
    }

    if(state.payments.some(p=>p.jobId===id)){
        showToast("งานนี้ชำระเงินแล้ว");
        return;
    }

    document.getElementById("modalTitle").textContent="รับชำระเงิน";

    document.getElementById("modalBody").innerHTML=`

        <div class="card">

            <div class="card-sub">หมายเลขงาน</div>
            <h3>${job.id}</h3>

            <div style="font-size:25px;color:#2563eb;font-weight:bold;margin-top:10px;">
                ${formatMoney(calculateJobTotal(job))} บาท

        </div>

        <div class="field">
            <label>วิธีชำระเงิน</label>

            <select id="payMethod">
                <option>เงินสด</option>
                <option>โอนเงิน</option>
                <option>บัตรเครดิต</option>
            </select>
        </div>

        <button class="primary"
                onclick="savePayment('${id}')">
            ยืนยันการชำระเงิน
        </button>
    `;

    openModal();
}

function savePayment(jobId){

    const job=state.jobs.find(j=>j.id===jobId);
    const method=document.getElementById("payMethod").value;

    const num=state.payments.length+1;

    state.payments.push({
        id:"PAY"+String(num).padStart(3,"0"),
        jobId,
        amount:calculateJobTotal(job),
        method,
        date:new Date().toISOString().slice(0,10),
        status:"ชำระแล้ว"
    });

    state.notifications.unshift({
        id:"N"+Date.now(),
        title:"รับชำระเงิน",
        text:`รับเงิน ${formatMoney(calculateJobTotal(job))} บาท`,
        date:"วันนี้",
        read:false
    });

    save();
    closeModal();
    renderPage();

    showToast("บันทึกการชำระเงินแล้ว");
}

function calculateJobTotal(job){

    let serviceTotal=0;

    job.serviceIds.forEach(id=>{

        const service=state.services.find(s=>s.id===id);

        if(service){
            serviceTotal+=Number(service.price)||0;
        }
    });

    let partTotal=0;

    job.parts.forEach(x=>{

        const part=state.parts.find(p=>p.id===x.partId);

        if(part){
            partTotal+=(Number(part.price)||0)*(Number(x.qty)||0);
        }
    });

    const total=serviceTotal+partTotal+(Number(job.labor)||0)-(Number(job.discount)||0);

    return Math.max(0,total);
}

function formatMoney(number){

    return Number(number||0).toLocaleString("th-TH",{
        minimumFractionDigits:0,
        maximumFractionDigits:2
    });
}

function percentage(value,total){

    if(!total) return 0;

    return Math.round((value/total)*100);
}

function openModal(){

    document.getElementById("modalBg").classList.add("show");
}

function closeModal(){

    document.getElementById("modalBg").classList.remove("show");
}

function showToast(message){

    const toast=document.getElementById("toast");

    toast.textContent=message;

    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}

function logout(){

    state.loggedIn=false;
    state.user=null;
    state.page="home";

    save();
    renderLogin();
}

function resetData(){

    if(!confirm("ต้องการรีเซ็ตข้อมูลตัวอย่างทั้งหมดหรือไม่?")) return;

    localStorage.removeItem(STORAGE_KEY);

    createDemoData();

    showToast("รีเซ็ตข้อมูลเรียบร้อย");

    setTimeout(()=>{
        renderLogin();
    },500);
}
