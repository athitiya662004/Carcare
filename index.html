<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>CarCare</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
}

body{
    background:#e9eef5;
    color:#172033;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#f7f9fc;
    position:relative;
    overflow:hidden;
}

/* LOGIN */
.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:linear-gradient(145deg,#2563eb,#1e40af);
}

.login-box{
    width:100%;
    background:white;
    padding:30px 24px;
    border-radius:28px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:75px;
    height:75px;
    border-radius:22px;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:38px;
}

.logo h1{
    margin-top:12px;
    font-size:30px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid #dce1ea;
    border-radius:13px;
    outline:none;
    background:white;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#2563eb;
}

.primary{
    width:100%;
    border:0;
    padding:14px;
    background:#2563eb;
    color:white;
    border-radius:14px;
    font-weight:bold;
    font-size:16px;
}

.primary:hover{
    background:#1d4ed8;
}

/* HEADER */
.header{
    padding:20px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e8ebf0;
}

.header h2{
    font-size:22px;
}

.header small{
    color:#777;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:13px;
    background:#eef4ff;
    color:#2563eb;
    font-size:19px;
}

/* PAGE */
.page{
    padding:18px;
    padding-bottom:95px;
    min-height:calc(100vh - 75px);
}

/* DASHBOARD */
.welcome{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    padding:20px;
    border-radius:22px;
    margin-bottom:18px;
}

.welcome p{
    opacity:.85;
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:white;
    padding:16px;
    border-radius:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat .emoji{
    font-size:25px;
}

.stat h3{
    margin-top:8px;
    font-size:22px;
}

.stat p{
    color:#777;
    font-size:13px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 12px;
}

.section-title h3{
    font-size:18px;
}

.section-title button{
    border:0;
    background:none;
    color:#2563eb;
}

/* CAR CARD */
.car-card{
    background:white;
    border-radius:20px;
    padding:12px;
    margin-bottom:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    display:flex;
    gap:12px;
}

.car-img{
    width:90px;
    height:90px;
    border-radius:16px;
    object-fit:cover;
    background:#e9eef5;
}

.car-info{
    flex:1;
}

.car-info h3{
    font-size:17px;
}

.car-info p{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:8px;
    font-size:11px;
    margin-top:7px;
}

.badge.blue{
    background:#e8f0ff;
    color:#2563eb;
}

.badge.green{
    background:#e8f8ef;
    color:#16834c;
}

.badge.red{
    background:#ffe9e9;
    color:#dc2626;
}

.badge.orange{
    background:#fff1df;
    color:#d97706;
}

/* MAINTENANCE */
.maintenance{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.maintenance-top{
    display:flex;
    justify-content:space-between;
}

.maintenance h4{
    font-size:16px;
}

.maintenance p{
    font-size:13px;
    color:#777;
    margin-top:5px;
}

.countdown{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#f0f6ff;
    color:#2563eb;
    font-weight:bold;
    text-align:center;
}

.countdown.danger{
    background:#fff0f0;
    color:#dc2626;
}

.countdown.warning{
    background:#fff5e8;
    color:#d97706;
}

.actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.small-btn{
    border:0;
    padding:8px 11px;
    border-radius:9px;
    font-size:12px;
}

.edit{
    background:#e8f0ff;
    color:#2563eb;
}

.delete{
    background:#ffe9e9;
    color:#dc2626;
}

.complete{
    background:#e8f8ef;
    color:#16834c;
}

/* FORM CARD */
.form-card{
    background:white;
    padding:18px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.image-upload{
    text-align:center;
    margin-bottom:20px;
}

.preview{
    width:130px;
    height:100px;
    object-fit:cover;
    border-radius:18px;
    background:#eef1f6;
    display:block;
    margin:0 auto 10px;
}

.upload-btn{
    display:inline-block;
    background:#eaf1ff;
    color:#2563eb;
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

/* HISTORY */
.history{
    background:white;
    padding:15px;
    border-radius:17px;
    margin-bottom:10px;
}

.history-row{
    display:flex;
    justify-content:space-between;
}

.price{
    font-weight:bold;
    color:#16834c;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:430px;
    height:72px;
    background:white;
    border-top:1px solid #e6e9ef;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
}

.nav-btn{
    background:none;
    border:0;
    color:#8a91a0;
    font-size:11px;
    text-align:center;
}

.nav-btn div{
    font-size:21px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:#2563eb;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:white;
    border-radius:25px 25px 0 0;
    padding:22px;
    max-height:90vh;
    overflow-y:auto;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
}

.close{
    border:0;
    background:#f0f1f4;
    width:35px;
    height:35px;
    border-radius:10px;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:35px 15px;
    color:#888;
}

.empty-icon{
    font-size:50px;
    margin-bottom:10px;
}

/* TOAST */
.toast{
    position:fixed;
    bottom:85px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#172033;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:300;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* DARK */
body.dark{
    background:#101827;
}

.dark .app,
.dark .page{
    background:#101827;
}

.dark .header,
.dark .stat,
.dark .car-card,
.dark .maintenance,
.dark .form-card,
.dark .history,
.dark .bottom-nav,
.dark .modal-box{
    background:#182235;
    color:#fff;
}

.dark .field input,
.dark .field select,
.dark .field textarea{
    background:#111a2b;
    color:white;
    border-color:#34415a;
}

.dark .stat p,
.dark .car-info p,
.dark .maintenance p{
    color:#aab3c4;
}

.dark .section-title{
    color:white;
}
</style>
</head>

<body>

<div class="app" id="app"></div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   DATA
========================= */

const carModels = {

    "Toyota":[
        "Yaris",
        "Yaris Ativ",
        "Vios",
        "Corolla Altis",
        "Camry",
        "Hilux Revo",
        "Fortuner",
        "Corolla Cross",
        "Innova"
    ],

    "Honda":[
        "City",
        "Civic",
        "Accord",
        "Jazz",
        "HR-V",
        "CR-V",
        "BR-V"
    ],

    "Isuzu":[
        "D-Max",
        "MU-X"
    ],

    "Mitsubishi":[
        "Mirage",
        "Attrage",
        "Triton",
        "Pajero Sport",
        "Xpander"
    ],

    "Nissan":[
        "Almera",
        "March",
        "Navara",
        "Kicks",
        "Terra",
        "Leaf"
    ],

    "Mazda":[
        "Mazda 2",
        "Mazda 3",
        "CX-3",
        "CX-30",
        "CX-5",
        "CX-8"
    ],

    "Ford":[
        "Ranger",
        "Everest",
        "Mustang"
    ],

    "MG":[
        "MG3",
        "MG5",
        "MG6",
        "ZS",
        "HS",
        "MG4"
    ],

    "BYD":[
        "ATTO 3",
        "Dolphin",
        "Seal",
        "M6"
    ],

    "Mercedes-Benz":[
        "A-Class",
        "C-Class",
        "E-Class",
        "S-Class",
        "GLA",
        "GLC"
    ],

    "BMW":[
        "Series 2",
        "Series 3",
        "Series 5",
        "X1",
        "X3",
        "X5"
    ],

    "Tesla":[
        "Model 3",
        "Model Y",
        "Model S",
        "Model X"
    ]
};

let cars = JSON.parse(localStorage.getItem("carcare_cars") || "[]");
let services = JSON.parse(localStorage.getItem("carcare_services") || "[]");
let history = JSON.parse(localStorage.getItem("carcare_history") || "[]");

let currentPage = "home";
let editingCar = null;
let editingService = null;

/* =========================
   LOGIN
========================= */

function isLogged(){
    return localStorage.getItem("carcare_logged") === "true";
}

function showLogin(){

    document.getElementById("app").innerHTML = `

    <div class="login">

        <div class="login-box">

            <div class="logo">

                <div class="logo-icon">🚗</div>

                <h1>CarCare</h1>

                <p>Smart Car Maintenance</p>

            </div>

            <div class="field">

                <label>ชื่อผู้ใช้</label>

                <input id="loginUser"
                       placeholder="กรอกชื่อผู้ใช้"
                       autocomplete="username">

            </div>

            <div class="field">

                <label>รหัสผ่าน</label>

                <input id="loginPass"
                       type="password"
                       placeholder="กรอกรหัสผ่าน"
                       autocomplete="current-password">

            </div>

            <button class="primary" onclick="login()">
                🔐 เข้าสู่ระบบ
            </button>

        </div>

    </div>

    `;

    const savedUser = localStorage.getItem("carcare_user");

    if(savedUser){
        document.getElementById("loginUser").value = savedUser;
    }
}

function login(){

    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if(!user || !pass){
        toast("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");
        return;
    }

    localStorage.setItem("carcare_user",user);
    localStorage.setItem("carcare_password",pass);
    localStorage.setItem("carcare_logged","true");

    requestNotification();

    render();
    toast("เข้าสู่ระบบสำเร็จ");
}

function logout(){

    localStorage.removeItem("carcare_logged");

    showLogin();
}

/* =========================
   STORAGE
========================= */

function saveData(){

    localStorage.setItem(
        "carcare_cars",
        JSON.stringify(cars)
    );

    localStorage.setItem(
        "carcare_services",
        JSON.stringify(services)
    );

    localStorage.setItem(
        "carcare_history",
        JSON.stringify(history)
    );
}

/* =========================
   RENDER
========================= */

function render(){

    if(!isLogged()){
        showLogin();
        return;
    }

    document.getElementById("app").innerHTML = `

        <div class="header">

            <div>
                <h2>${pageTitle()}</h2>
                <small>CarCare 🚗</small>
            </div>

            <button class="icon-btn"
                    onclick="toggleDark()">
                🌙
            </button>

        </div>

        <div class="page" id="page"></div>

        <div class="bottom-nav">

            <button class="nav-btn ${currentPage==='home'?'active':''}"
                    onclick="go('home')">
                <div>🏠</div>
                หน้าหลัก
            </button>

            <button class="nav-btn ${currentPage==='cars'?'active':''}"
                    onclick="go('cars')">
                <div>🚗</div>
                รถของฉัน
            </button>

            <button class="nav-btn ${currentPage==='service'?'active':''}"
                    onclick="go('service')">
                <div>🔧</div>
                บำรุงรักษา
            </button>

            <button class="nav-btn ${currentPage==='history'?'active':''}"
                    onclick="go('history')">
                <div>📜</div>
                ประวัติ
            </button>

            <button class="nav-btn ${currentPage==='settings'?'active':''}"
                    onclick="go('settings')">
                <div>⚙️</div>
                ตั้งค่า
            </button>

        </div>
    `;

    renderPage();

    updateCountdowns();
}

function pageTitle(){

    const titles = {
        home:"หน้าหลัก",
        cars:"รถของฉัน",
        service:"บำรุงรักษา",
        history:"ประวัติ",
        settings:"ตั้งค่า"
    };

    return titles[currentPage];
}

function go(page){

    currentPage = page;

    render();
}

/* =========================
   HOME
========================= */

function renderHome(){

    const upcoming = services
        .filter(x => !x.completed)
        .sort((a,b)=>new Date(a.date)-new Date(b.date))
        .slice(0,3);

    const totalCost =
        history.reduce((sum,x)=>sum + Number(x.cost || 0),0);

    return `

    <div class="welcome">

        <h2>สวัสดี 👋</h2>

        <p>ดูแลรถของคุณให้อยู่ในสภาพดีที่สุด</p>

    </div>

    <div class="stats">

        <div class="stat">
            <div class="emoji">🚗</div>
            <h3>${cars.length}</h3>
            <p>รถทั้งหมด</p>
        </div>

        <div class="stat">
            <div class="emoji">🔧</div>
            <h3>${services.filter(x=>!x.completed).length}</h3>
            <p>รายการที่รอดำเนินการ</p>
        </div>

        <div class="stat">
            <div class="emoji">💰</div>
            <h3>${formatMoney(totalCost)}</h3>
            <p>ค่าใช้จ่ายทั้งหมด</p>
        </div>

        <div class="stat">
            <div class="emoji">📜</div>
            <h3>${history.length}</h3>
            <p>ประวัติการบำรุง</p>
        </div>

    </div>

    <div class="section-title">

        <h3>🚗 รถของฉัน</h3>

        <button onclick="openCarModal()">
            + เพิ่มรถ
        </button>

    </div>

    ${
        cars.length
        ? cars.slice(0,2).map(carCard).join("")
        : empty("🚗","ยังไม่มีข้อมูลรถ")
    }

    <div class="section-title">

        <h3>🔔 กำหนดบำรุงใกล้ถึง</h3>

        <button onclick="go('service')">
            ดูทั้งหมด
        </button>

    </div>

    ${
        upcoming.length
        ? upcoming.map(serviceCard).join("")
        : empty("🔧","ไม่มีรายการใกล้ถึง")
    }

    `;
}

/* =========================
   CARS
========================= */

function renderCars(){

    return `

    <div class="section-title">

        <h3>รถของฉัน</h3>

        <button onclick="openCarModal()">
            + เพิ่มรถ
        </button>

    </div>

    ${
        cars.length
        ? cars.map(carCard).join("")
        : empty("🚗","ยังไม่มีรถ","กด + เพิ่มรถ เพื่อเริ่มต้น")
    }

    `;
}

function carCard(car){

    return `

    <div class="car-card">

        <img class="car-img"
             src="${car.image || placeholderImage()}"
             onerror="this.src='${placeholderImage()}'">

        <div class="car-info">

            <h3>${escapeHTML(car.brand)} ${escapeHTML(car.model)}</h3>

            <p>ปี ${car.year}</p>

            ${car.plate ? `<p>ทะเบียน ${escapeHTML(car.plate)}</p>` : ""}

            ${
                car.mileage
                ? `<p>เลขไมล์ ${Number(car.mileage).toLocaleString()} กม.</p>`
                : ""
            }

            <span class="badge blue">
                ${services.filter(x=>x.carId===car.id && !x.completed).length}
                รายการ
            </span>

            <div class="actions">

                <button class="small-btn edit"
                        onclick="openCarModal('${car.id}')">
                    ✏️ แก้ไข
                </button>

                <button class="small-btn delete"
                        onclick="deleteCar('${car.id}')">
                    🗑️ ลบ
                </button>

            </div>

        </div>

    </div>

    `;
}

/* =========================
   SERVICE
========================= */

function renderServices(){

    const sorted = [...services]
        .sort((a,b)=>new Date(a.date)-new Date(b.date));

    return `

    <div class="section-title">

        <h3>รายการบำรุงรักษา</h3>

        <button onclick="openServiceModal()">
            + เพิ่มรายการ
        </button>

    </div>

    ${
        sorted.length
        ? sorted.map(serviceCard).join("")
        : empty("🔧","ยังไม่มีรายการบำรุงรักษา")
    }

    `;
}

function serviceCard(s){

    const car = cars.find(c=>c.id===s.carId);

    return `

    <div class="maintenance">

        <div class="maintenance-top">

            <div>

                <h4>${escapeHTML(s.title)}</h4>

                <p>
                    🚗 ${car
                        ? escapeHTML(car.brand+" "+car.model)
                        : "ไม่พบรถ"}
                </p>

                <p>📅 ${formatDate(s.date)}</p>

                ${
                    s.cost
                    ? `<p>💰 ${formatMoney(s.cost)}</p>`
                    : ""
                }

            </div>

            <div>
                ${
                    s.completed
                    ? `<span class="badge green">เสร็จแล้ว</span>`
                    : `<span class="badge blue">รอดำเนินการ</span>`
                }
            </div>

        </div>

        ${
            !s.completed
            ? `<div class="countdown"
                    data-date="${s.date}"
                    id="count-${s.id}">
                    กำลังคำนวณ...
               </div>`
            : ""
        }

        ${
            s.note
            ? `<p style="margin-top:10px">
                📝 ${escapeHTML(s.note)}
               </p>`
            : ""
        }

        <div class="actions">

            ${
                !s.completed
                ? `<button class="small-btn complete"
                         onclick="completeService('${s.id}')">
                         ✓ เสร็จแล้ว
                       </button>`
                : ""
            }

            <button class="small-btn edit"
                    onclick="openServiceModal('${s.id}')">
                ✏️ แก้ไข
            </button>

            <button class="small-btn delete"
                    onclick="deleteService('${s.id}')">
                🗑️ ลบ
            </button>

        </div>

    </div>

    `;
}

/* =========================
   HISTORY
========================= */

function renderHistory(){

    const sorted = [...history]
        .sort((a,b)=>new Date(b.date)-new Date(a.date));

    const total =
        sorted.reduce((sum,x)=>sum+Number(x.cost||0),0);

    return `

    <div class="welcome">

}

function historyCard(h){

    const car = cars.find(c=>c.id===h.carId);

            <div>

                <strong>${escapeHTML(h.title)}</strong>

    `;
}

/* =========================
   CAR MODAL
========================= */

function openCarModal(id=null){

    editingCar = id;

    const car = id
        ? cars.find(c=>c.id===id)
        : null;

    const brands = Object.keys(carModels);

    document.getElementById("app").insertAdjacentHTML(
        "beforeend",

        `
        <div class="modal" id="carModal"
             style="display:flex">

            <div class="modal-box">

                <div class="modal-head">

                    <h3>${car ? "✏️ แก้ไขรถ" : "🚗 เพิ่มรถ"}</h3>

                    <button class="close"
                            onclick="closeModal()">
                        ✕
                    </button>

                </div>

                <div class="image-upload">

                    <img id="carPreview"
                         class="preview"
                         src="${car?.image || placeholderImage()}">

                    <label class="upload-btn">
                        📷 เลือกรูปรถ
                        <input type="file"
                               id="carImage"
                               accept="image/*"
                               onchange="previewCarImage(event)">
                    </label>

                </div>

                <div class="field">

                    <label>ยี่ห้อรถ *</label>

                    <select id="carBrand"
                            onchange="updateModels()">

                        <option value="">เลือกยี่ห้อ</option>

                        ${
                            brands.map(b=>
                                `<option value="${b}"
                                    ${car?.brand===b?"selected":""}>
                                    ${b}
                                </option>`
                            ).join("")
                        }

                    </select>

                </div>

                <div class="field">

                    <label>รุ่นรถ *</label>

                    <select id="carModel">

                        <option value="">
                            เลือกรุ่นรถ
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>ปีรถ *</label>

                    <select id="carYear">

                        <option value="">เลือกปี</option>

                        ${
                            Array.from(
                                {length:40},
                                (_,i)=>2026-i
                            ).map(y=>
                                `<option value="${y}"
                                    ${car?.year==y?"selected":""}>
                                    ${y}
                                </option>`
                            ).join("")
                        }

                    </select>

                </div>

                <div class="field">

                    <label>ทะเบียนรถ</label>

                    <input id="carPlate"
                           value="${car?.plate || ""}"
                           placeholder="เช่น กข 1234">

                </div>

                <div class="field">

                    <label>เลขไมล์ปัจจุบัน</label>

                    <input id="carMileage"
                           type="number"
                           value="${car?.mileage || ""}"
                           placeholder="เช่น 45000">

                </div>

                <button class="primary"
                        onclick="saveCar()">

                    💾 ${car ? "บันทึกการแก้ไข" : "เพิ่มรถ"}

                </button>

            </div>

        </div>
        `
    );

    updateModels(car?.model);
}

function updateModels(selected=""){

    const brand = document.getElementById("carBrand")?.value;

    const model = document.getElementById("carModel");

    if(!model) return;

    model.innerHTML =
        `<option value="">เลือกรุ่นรถ</option>`;

    if(!brand) return;

    carModels[brand].forEach(m=>{

        model.innerHTML += `
            <option value="${m}"
                ${m===selected?"selected":""}>
                ${m}
            </option>
        `;

    });
}

function previewCarImage(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = e=>{

        document.getElementById("carPreview").src =
            e.target.result;

    };

    reader.readAsDataURL(file);
}

function saveCar(){

    const brand =
        document.getElementById("carBrand").value;

    const model =
        document.getElementById("carModel").value;

    const year =
        document.getElementById("carYear").value;

    const plate =
        document.getElementById("carPlate").value.trim();

    const mileage =
        document.getElementById("carMileage").value;

    const image =
        document.getElementById("carPreview").src;

    if(!brand || !model || !year){

        toast("กรุณากรอกข้อมูลรถให้ครบ");

        return;
    }

    if(editingCar){

        const car =
            cars.find(c=>c.id===editingCar);

        car.brand = brand;
        car.model = model;
        car.year = year;
        car.plate = plate;
        car.mileage = mileage;
        car.image =
            image.startsWith("data:")
            ? image
            : car.image;

        toast("แก้ไขข้อมูลรถแล้ว");

    }else{

        cars.push({

            id:Date.now().toString(),

            brand,
            model,
            year,
            plate,
            mileage,
            image:image.startsWith("data:")
                ? image
                : ""

        });

        toast("เพิ่มรถเรียบร้อยแล้ว");
    }

    saveData();

    closeModal();

    render();
}

function deleteCar(id){

    if(!confirm("ต้องการลบรถคันนี้หรือไม่?")) return;

    cars = cars.filter(c=>c.id!==id);

    services = services.filter(s=>s.carId!==id);

    history = history.filter(h=>h.carId!==id);

    saveData();

    render();

    toast("ลบรถแล้ว");
}

                            "ตรวจเช็กระบบแอร์",

                </div>

                <div class="field">

                    <label>ค่าใช้จ่ายโดยประมาณ</label>

                           value="${s?.cost || ""}"

                </div>

                <div class="field">

                    <label>หมายเหตุ</label>

                    <textarea id="serviceNote"
                              rows="3"

                        onclick="saveService()">

function saveService(){

    const carId =
        document.getElementById("serviceCar").value;

    const title =
        document.getElementById("serviceTitle").value;

    const date =
        document.getElementById("serviceDate").value;

    const cost =
        document.getElementById("serviceCost").value;

    const note =
        document.getElementById("serviceNote").value.trim();

    if(!carId || !title || !date){

        toast("กรุณากรอกข้อมูลให้ครบ");

        return;
    }

    if(editingService){

        const s =
            services.find(x=>x.id===editingService);

        s.carId = carId;
        s.title = title;
        s.date = date;
        s.cost = cost;
        s.note = note;

        toast("แก้ไขรายการแล้ว");

    }else{

        services.push({

            id:Date.now().toString(),

            carId,
            title,
            date,
            cost,
            note,

            completed:false

        });

        toast("เพิ่มรายการบำรุงแล้ว");

    }

    saveData();

    closeModal();

    render();

    checkNotifications();
}

function deleteService(id){

    if(!confirm("ต้องการลบรายการนี้หรือไม่?"))
        return;

    services =
        services.filter(x=>x.id!==id);

    saveData();

    render();

    toast("ลบรายการแล้ว");
}

function completeService(id){

    const s =
        services.find(x=>x.id===id);

    if(!s) return;

    s.completed = true;

    history.push({

        id:Date.now().toString(),

        carId:s.carId,

        title:s.title,

        date:new Date().toISOString().split("T")[0],

        cost:s.cost || 0

    });

    saveData();

    render();

    toast("บันทึกเข้าประวัติแล้ว");
}

/* =========================
   COUNTDOWN
========================= */

function updateCountdowns(){

    document.querySelectorAll("[data-date]")
        .forEach(el=>{

            const date = new Date(
                el.dataset.date + "T23:59:59"
            );

            const now = new Date();

            const diff =
                date.getTime() - now.getTime();

            const days =
                Math.ceil(diff / 86400000);

            if(days < 0){

                el.innerHTML =
                    "⚠️ เลยกำหนดแล้ว";

                el.classList.add("danger");

            }else if(days === 0){

                el.innerHTML =
                    "🔔 วันนี้ถึงกำหนด!";

                el.classList.add("danger");

            }else if(days <= 7){

                el.innerHTML =
                    "⚠️ เหลือ " + days + " วัน";

                el.classList.add("warning");

            }else{

                el.innerHTML =
                    "⏳ เหลือ " + days + " วัน";

            }

        });
}

/* =========================
   NOTIFICATION
========================= */

async function requestNotification(){

    if(!("Notification" in window)){

        toast("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน");

        return;
    }

    const permission =
        await Notification.requestPermission();

    if(permission==="granted"){

        toast("เปิดการแจ้งเตือนแล้ว");

        checkNotifications();

    }else{

        toast("กรุณาอนุญาตการแจ้งเตือนจากเบราว์เซอร์");

    }
}

function testNotification(){

    if(!("Notification" in window)){

        toast("เบราว์เซอร์ไม่รองรับ Notification");

        return;
    }

    if(Notification.permission !== "granted"){

        requestNotification();

        return;
    }

    new Notification("🚗 CarCare",{

        body:"นี่คือการแจ้งเตือนทดสอบ ระบบพร้อมแจ้งเตือนคุณแล้ว",

    });

    toast("ส่งการแจ้งเตือนทดสอบแล้ว");
}

function checkNotifications(){

    if(!("Notification" in window))
        return;

    if(Notification.permission !== "granted")
        return;

    const today =
        new Date();

    services.forEach(s=>{

        if(s.completed) return;

        const date =
            new Date(s.date+"T23:59:59");

        const diff =
            Math.ceil(
                (date-today)/86400000
            );

        if(diff>=0 && diff<=3){

            const key =
                "notify_"+s.id+"_"+s.date;

            if(!localStorage.getItem(key)){

                new Notification("🚗 CarCare",{

                    body:
                    diff===0
                    ? `วันนี้ถึงกำหนด ${s.title}`
                    : `${s.title} จะถึงกำหนดใน ${diff} วัน`

                });

                localStorage.setItem(key,"true");
            }
        }

    });
}

/* =========================
   UTILITIES
========================= */

function closeModal(){

    const modal =
        document.querySelector(".modal");

    if(modal)
        modal.remove();

    editingCar = null;
    editingService = null;
}

function empty(icon,title,text=""){

    return `

    <div class="empty">

        <div class="empty-icon">${icon}</div>

        <h3>${title}</h3>

        ${
            text
            ? `<p style="margin-top:7px">${text}</p>`
            : ""
        }

    </div>

    `;
}

function placeholderImage(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             width="300"
             height="200">
            <rect width="100%"
                  height="100%"
                  fill="#e9eef5"/>
            <text x="50%"
                  y="50%"
                  dominant-baseline="middle"
                  text-anchor="middle"
                  font-size="60">
                🚗
            </text>
        </svg>
        `);
}

function formatMoney(number){

    return Number(number || 0)
        .toLocaleString("th-TH") + " บาท";
}

function formatDate(date){

    if(!date) return "-";

    return new Date(date+"T00:00:00")
        .toLocaleDateString(
            "th-TH",
            {
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );
}

function escapeHTML(str){

    if(!str) return "";

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2500);
}

function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "carcare_dark",
        document.body.classList.contains("dark")
    );
}

function clearAllData(){

    if(!confirm(
        "ข้อมูลรถ รายการบำรุง และประวัติทั้งหมดจะถูกลบ ต้องการดำเนินการต่อหรือไม่?"
    )) return;

    cars=[];
    services=[];
    history=[];

    saveData();

    render();

    toast("ล้างข้อมูลทั้งหมดแล้ว");
}

/* =========================
   START
========================= */

if(localStorage.getItem("carcare_dark")==="true"){
    document.body.classList.add("dark");
}

render();

/* ตรวจสอบแจ้งเตือนทุก 30 วินาที */
setInterval(()=>{

    checkNotifications();

    updateCountdowns();

},30000);

</script>
